; Runs as the unprivileged `ws` user, so every path lives under /tmp.
;
; Xvfb + x11vnc rather than Xtigervnc: some Xtigervnc builds ship without GLX,
; and RViz's Ogre backend then fails to start with an opaque error.
[supervisord]
nodaemon=false
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_XVFB_GEOMETRY)s +extension GLX +extension RANDR +render -noreset
autorestart=true
priority=10
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.err

[program:openbox]
command=/usr/bin/openbox --sm-disable
environment=DISPLAY=":1"
autorestart=true
priority=20
startsecs=2
stdout_logfile=/tmp/openbox.log
stderr_logfile=/tmp/openbox.err

[program:x11vnc]
command=/usr/local/bin/start_x11vnc.sh
; VNC_PASSWORD in the environment switches this from -nopw to a password
; file. Teammates reach this port across the team wifi, so on a shared
; network it is worth setting.
autorestart=true
priority=30
startsecs=2
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc %(ENV_NOVNC_PORT)s localhost:5901
autorestart=true
priority=40
startsecs=2
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.err
