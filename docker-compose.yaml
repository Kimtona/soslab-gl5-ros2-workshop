# Two roles per team.
#
#   --profile lidar    the one machine the GL5 is plugged into. Needs real host
#                      networking, so a Linux host or a WSL2 distro running
#                      docker-ce with mirrored networking. Docker Desktop's
#                      host mode is an L4 forwarder and will not work.
#   --profile lidar-mac  a Docker Desktop host (Mac, Windows) the GL5 is
#                      plugged into. No host networking; the stream arrives on
#                      a published UDP port instead.
#   --profile viewer   everyone else, Macs included. Connects to the team's
#                      zenoh router over a single outbound TCP connection,
#                      which passes through Docker Desktop's NAT untouched.
name: soslab-gl5-workshop

x-common: &common
  image: ${IMAGE:-ghcr.io/kimtona/soslab-gl5-ros2-workshop}:${TAG:-prebuilt}
  environment: &common-env
    ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-77}"
    RMW_IMPLEMENTATION: rmw_zenoh_cpp
    XVFB_GEOMETRY: "${XVFB_GEOMETRY:-1600x900x24}"
    # Teammates open this host's 6080 across the team wifi; set a password in
    # .env if the network is shared with people outside the workshop.
    VNC_PASSWORD: "${VNC_PASSWORD:-}"
  volumes:
    - ./ws/src:/home/ws/ws/src
    - ws-build:/home/ws/ws/build
    - ws-install:/home/ws/ws/install
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  # The GL5 driver. network_mode host means no `ports:` is allowed here, and
  # none is needed: 6080 is already on the host. The image starts a Zenoh router
  # of its own, and on host networking that is the team's router on tcp/7447.
  lidar:
    <<: *common
    profiles: ["lidar"]
    container_name: soslab-gl5-lidar
    network_mode: host
    privileged: true
    environment:
      <<: *common-env
      SOSLAB_LIDAR_TYPE: "${SOSLAB_LIDAR_TYPE:-GL5}"
      SOSLAB_DEVICE_IP: "${SOSLAB_DEVICE_IP:-192.168.1.10}"
      SOSLAB_DEVICE_PORT: "${SOSLAB_DEVICE_PORT:-2000}"
      SOSLAB_PC_IP: "${SOSLAB_PC_IP:-0.0.0.0}"
      SOSLAB_PC_PORT: "${SOSLAB_PC_PORT:-0}"
    command: ["bash"]

  # The same driver on a host whose Docker cannot see the sensor's wire. The
  # image patches the SDK's connect()ed UDP socket away, so a datagram still
  # counts after Docker rewrites its source address on the way in. The price is
  # that the port is no longer free: the published port, the sensor's flashed
  # pcPort and ip_port_pc must all be the same number.
  lidar-mac:
    <<: *common
    profiles: ["lidar-mac"]
    container_name: soslab-gl5-lidar-mac
    # netcheck and the tcpdump in the docs need a raw socket. Not privileged:
    # this container has no device to reach, only a published port.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    ports:
      - "${NOVNC_PORT:-6080}:6080"
      - "${SOSLAB_PC_PORT:-2368}:${SOSLAB_PC_PORT:-2368}/udp"
    environment:
      <<: *common-env
      SOSLAB_LIDAR_TYPE: "${SOSLAB_LIDAR_TYPE:-GL5}"
      SOSLAB_DEVICE_IP: "${SOSLAB_DEVICE_IP:-192.168.1.10}"
      SOSLAB_DEVICE_PORT: "${SOSLAB_DEVICE_PORT:-2000}"
      # Bind every interface: the container has no address on the sensor's
      # subnet and does not need one.
      SOSLAB_PC_IP: "0.0.0.0"
      SOSLAB_PC_PORT: "${SOSLAB_PC_PORT:-2368}"
    command: ["bash"]

  # The Jetson. Replays a recorded scan so the five sensors can all go to teams,
  # and serves as the router and noVNC everyone falls back to.
  reference:
    <<: *common
    profiles: ["reference"]
    container_name: soslab-gl5-reference
    network_mode: host
    volumes:
      - ./ws/src:/home/ws/ws/src
      - ./reference_bag:/opt/reference_bag:ro
      - ws-build:/home/ws/ws/build
      - ws-install:/home/ws/ws/install
    command: ["play_reference"]

  viewer:
    <<: *common
    profiles: ["viewer"]
    container_name: soslab-gl5-viewer
    ports:
      - "${NOVNC_PORT:-6080}:6080"
    environment:
      <<: *common-env
      # rmw_zenoh peers default to tcp/localhost:7447; point them at the team's
      # router instead. No local zenohd is needed on a viewer.
      ZENOH_CONFIG_OVERRIDE: 'connect/endpoints=["tcp/${ROUTER_HOST:-127.0.0.1}:7447"]'
    command: ["bash"]

volumes:
  # Named volumes, not bind mounts: a bind-mounted colcon build tree on Docker
  # Desktop for macOS is painfully slow.
  ws-build:
  ws-install:
