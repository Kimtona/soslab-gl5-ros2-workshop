name: image

# Builds each architecture on its own native runner and then stitches the two
# into one manifest. QEMU would work but compiling the SDK plus the vendored
# Asio headers under emulation takes 25-45 minutes for the arm64 leg against
# 6-10 minutes native.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

jobs:
  # GHCR rejects uppercase image paths and github.repository may contain them.
  name:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.lc.outputs.image }}
    steps:
      - id: lc
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: name
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04,     platform: linux/amd64, arch: amd64, target: prebuilt, heavy: 0 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64, target: prebuilt, heavy: 0 }
          # The dev image keeps the heavy deps so the vendor's own build
          # instructions work verbatim during the workshop.
          - { runner: ubuntu-24.04,     platform: linux/amd64, arch: amd64, target: dev,      heavy: 1 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64, target: dev,      heavy: 1 }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          build-args: INSTALL_HEAVY_DEPS=${{ matrix.heavy }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}-${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.arch }}-${{ matrix.target }},mode=max
          outputs: type=image,name=${{ needs.name.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [name, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [prebuilt, dev]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.target }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ${{ needs.name.outputs.image }}
        run: |
          set -euo pipefail
          refs=()
          for f in /tmp/digests/*; do
            refs+=("${IMAGE}@sha256:$(basename "$f")")
          done
          printf 'merging %s\n' "${refs[@]}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${{ matrix.target }}" \
            --tag "${IMAGE}:${{ matrix.target }}-${GITHUB_SHA::7}" \
            "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${{ matrix.target }}"
